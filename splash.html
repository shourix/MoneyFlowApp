<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyFlow Splash Screen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#F5F7FA 0%,#E8F5F3 50%,#D1FAE5 100%);font-family:'Noto Sans JP','Helvetica Neue',sans-serif;overflow:hidden}
.splash{text-align:center}
.icon{width:128px;height:128px;margin:0 auto 28px;border-radius:28px;background:#fff;box-shadow:0 8px 32px rgba(20,184,166,.15),0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:contain}
.app-name{font-size:1.8rem;font-weight:700;color:#1E293B;letter-spacing:-.02em;margin-bottom:6px}
.app-name span{color:#14B8A6}
.tagline{font-size:.85rem;color:#64748B;font-weight:400;letter-spacing:.02em}

/* Dark variant */
.dark body{background:linear-gradient(160deg,#0F172A 0%,#132E2A 50%,#1A3A35 100%)}
.dark .icon{background:#1E293B;box-shadow:0 8px 32px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.15)}
.dark .app-name{color:#E2E8F0}
.dark .app-name span{color:#2DD4BF}
.dark .tagline{color:#94A3B8}
</style>
</head>
<body>
<div class="splash">
  <div class="icon"><img src="icon-512.png" alt="MoneyFlow"></div>
  <div class="app-name">Money<span>Flow</span></div>
  <div class="tagline">将来の家計が見える</div>
</div>
</body>
</html>
